<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#183f2a">

<title>Moje pole</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>

:root{
 --green:#205b3a;
 --blue:#1769d2;
 --bg:#f4f6f3;
 --border:#dce4dd;
 --text:#17231b;
 --muted:#68756c;
 --orange:#b9681d;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:var(--bg);
 color:var(--text)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

#map{
 position:absolute;
 inset:0
}

.leaflet-top.leaflet-left{
 top:90px;
 left:8px
}

.leaflet-top.leaflet-right{
 top:90px;
 right:8px
}

/* ==================================================
   NÁZEV POLE NA MAPĚ
================================================== */

.field-label{
 background:rgba(255,255,255,.92);
 border:2px solid #1769d2;
 border-radius:9px;
 box-shadow:0 2px 7px rgba(0,0,0,.25);
 color:#17231b;
 font-weight:900;
 font-size:13px;
 padding:4px 7px;
 text-align:center;
 white-space:nowrap;
}

.field-label:before{
 display:none
}

.field-label .crop{
 font-size:11px;
 font-weight:800;
 color:#38503e
}

/* ==================================================
   HLAVIČKA
================================================== */

.header{
 position:absolute;
 z-index:2000;
 top:0;
 left:0;
 right:0;
 padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
 pointer-events:none
}

.headerInner{
 max-width:900px;
 margin:auto;
 height:60px;
 padding:8px 10px 8px 14px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:rgba(255,255,255,.96);
 border-radius:18px;
 box-shadow:0 5px 22px rgba(0,0,0,.18);
 backdrop-filter:blur(10px);
 pointer-events:auto
}

.brand{
 display:flex;
 align-items:center;
 gap:9px;
 font-size:19px;
 font-weight:800
}

.brandIcon{
 width:40px;
 height:40px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:12px;
 background:var(--green);
 font-size:22px
}

.headerButtons{
 display:flex;
 gap:8px
}

.headerBtn{
 min-width:44px;
 height:42px;
 border:0;
 border-radius:12px;
 padding:0 12px;
 background:#e8efe9;
 color:var(--green);
 font-weight:750
}

.headerBtn.primary{
 background:var(--green);
 color:white
}

/* ==================================================
   PANEL
================================================== */

.panel{
 position:fixed;
 z-index:5000;
 display:none;
 left:0;
 right:0;
 bottom:0;
 max-height:90vh;
 overflow:auto;
 background:#f5f7f4;
 border-radius:24px 24px 0 0;
 box-shadow:0 -8px 35px rgba(0,0,0,.28);
 padding-bottom:env(safe-area-inset-bottom)
}

.panel.open{
 display:block
}

.panelHeader{
 position:sticky;
 top:0;
 z-index:10;
 min-height:62px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 15px;
 background:rgba(31,91,58,.97);
 color:white
}

.panelHeader h2{
 margin:0;
 font-size:19px
}

.close{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:white;
 color:var(--green);
 font-size:22px;
 font-weight:bold
}

.content{
 padding:14px
}

.card{
 background:white;
 border:1px solid var(--border);
 border-radius:17px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 2px 8px rgba(0,0,0,.06)
}

.fieldTitle{
 font-size:24px;
 font-weight:800
}

.area{
 margin-top:5px;
 font-size:19px;
 font-weight:800;
 color:var(--green)
}

.small{
 color:var(--muted);
 font-size:13px;
 margin-top:4px
}

.cropCurrent{
 display:inline-block;
 margin-top:9px;
 padding:7px 10px;
 border-radius:10px;
 font-weight:800;
 background:#edf2ed
}

.notice{
 padding:12px;
 margin-bottom:12px;
 border-radius:12px;
 background:#fff5d6;
 border:1px solid #ead99e;
 line-height:1.45
}

/* ==================================================
   TLAČÍTKA
================================================== */

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:11px;
 margin-top:15px
}

.action{
 min-height:88px;
 padding:11px 5px;
 border:1px solid var(--border);
 border-radius:15px;
 background:#f5f8f5;
 color:var(--text);
 font-weight:750
}

.action span{
 display:block;
 font-size:28px;
 margin-bottom:5px
}

.action.split{
 background:#fff2e4;
 border-color:#efcfaa;
 color:#85470e
}

.fullButton{
 width:100%;
 min-height:48px;
 border:0;
 border-radius:12px;
 padding:12px 14px;
 margin-top:9px;
 font-weight:750;
 font-size:16px
}

.green{
 background:var(--green)!important;
 color:white!important
}

.orange{
 background:var(--orange)!important;
 color:white!important
}

.red{
 background:#a43d36!important;
 color:white!important
}

.back{
 border:0;
 border-radius:10px;
 padding:9px 12px;
 margin-bottom:11px;
 background:#e5ece6;
 color:var(--green);
 font-weight:750
}

/* ==================================================
   FORMULÁŘ
================================================== */

label{
 display:block;
 margin:14px 0 5px;
 font-weight:700
}

input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #cbd5cd;
 border-radius:11px;
 background:white;
 font-size:16px
}

textarea{
 min-height:80px
}

.fieldButton{
 width:100%;
 text-align:left;
 border:1px solid var(--border);
 border-radius:14px;
 background:white;
 padding:14px;
 margin-bottom:8px
}

.fieldButton b{
 font-size:17px
}

.history{
 margin:9px 0;
 padding:11px;
 border-left:5px solid #1769d2;
 border-radius:9px;
 background:#f3f7f3
}

.total{
 color:var(--green);
 font-weight:800;
 margin-top:5px
}

/* ==================================================
   DĚLENÍ POLE
================================================== */

.splitBox{
 position:fixed;
 display:none;
 z-index:6000;
 left:12px;
 right:12px;
 bottom:calc(15px + env(safe-area-inset-bottom));
 background:rgba(24,43,31,.95);
 color:white;
 border-radius:18px;
 padding:14px;
 box-shadow:0 5px 25px rgba(0,0,0,.35)
}

.splitBox.active{
 display:block
}

.splitTitle{
 font-size:17px;
 font-weight:800;
 margin-bottom:5px
}

.splitText{
 font-size:13px;
 line-height:1.4;
 opacity:.9
}

.splitActions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:10px
}

.splitAction{
 border:0;
 border-radius:10px;
 padding:11px;
 font-weight:750
}

.cancel{
 background:white;
 color:#333
}

.finish{
 background:#3c8b5b;
 color:white
}

@media(min-width:760px){

 .panel{
  left:auto;
  right:18px;
  bottom:18px;
  width:510px;
  border-radius:24px;
  max-height:88vh
 }

 .splitBox{
  left:50%;
  right:auto;
  width:460px;
  transform:translateX(-50%)
 }
}

</style>
</head>

<body>

<div id="map"></div>

<div class="header">
 <div class="headerInner">

  <div class="brand">
   <div class="brandIcon">🚜</div>
   <div>Moje pole</div>
  </div>

  <div class="headerButtons">
   <button class="headerBtn" onclick="locateMe()">📍</button>
   <button class="headerBtn primary" onclick="openFields()">☰ Pole</button>
  </div>

 </div>
</div>

<div id="panel" class="panel">

 <div class="panelHeader">

  <h2 id="panelTitle">
   Moje pole
  </h2>

  <button class="close" onclick="closePanel()">
   ×
  </button>

 </div>

 <div id="panelContent" class="content"></div>

</div>

<div id="splitBox" class="splitBox">

 <div class="splitTitle">
  ✂️ Rozdělení pole
 </div>

 <div id="splitText" class="splitText">
  Klepni na jeden okraj pole a potom na druhý.
 </div>

 <div class="splitActions">

  <button class="splitAction cancel" onclick="cancelSplit()">
   Zrušit
  </button>

  <button class="splitAction finish" onclick="resetSplit()">
   Začít znovu
  </button>

 </div>

</div>

<input
 type="file"
 id="importFile"
 accept=".json,application/json"
 style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

<script>

/* ==================================================
   MAPA
================================================== */

const map=
L.map('map')
.setView(
 [49.55,16.95],
 13
);

const satellite=
L.tileLayer(
 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
 {
  maxZoom:20,
  attribution:'Esri'
 }
);

const normal=
L.tileLayer(
 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
 {
  maxZoom:20,
  attribution:'© OpenStreetMap'
 }
);

satellite.addTo(map);


/* ==================================================
   KATASTR
================================================== */

const katastr=
L.tileLayer.wms(
 'https://services.cuzk.gov.cz/wms/local-km-wms.asp',
 {
  layers:'hranice_parcel,parcelni_cisla',
  format:'image/png',
  transparent:true,
  version:'1.3.0',
  maxZoom:22,
  attribution:'ČÚZK'
 }
);

katastr.addTo(map);

L.control.layers(
 {
  '🛰️ Letecká':satellite,
  '🗺️ Mapa':normal
 },
 {
  '📐 Katastr ČÚZK':katastr
 },
 {
  position:'topright'
 }
).addTo(map);


/* ==================================================
   BARVY PLODIN
================================================== */

const cropColors={

 'Ječmen':'#e7c95c',

 'Ječmen ozimý':'#d99f43',

 'Pšenice':'#efb94f',

 'Hrách':'#70ad62',

 'Kukuřice':'#d6dd50'

};

function cropColor(crop){

 return cropColors[crop] || '#777777';

}


/* ==================================================
   VRSTVA POLÍ
================================================== */

const fields=
new L.FeatureGroup();

map.addLayer(fields);


/* ==================================================
   VZHLED POLE

   HRANICE = MODRÁ
   BEZ PLODINY = ŠEDÁ
================================================== */

function fieldStyle(properties={}){

 const crop=
 properties.currentCrop||'';

 return{

  /* MODRÁ HRANICE */

  color:'#1769d2',

  weight:6,

  opacity:1,

  /* BARVA VNITŘKU */

  fillColor:
   crop
   ? cropColor(crop)
   : '#777777',

  fillOpacity:
   crop
   ? .43
   : .28,

  lineJoin:'round'

 };

}


/* ==================================================
   PLOCHA
================================================== */

function areaFromGeoJSON(feature){

 try{

  return turf.area(feature)/10000;

 }
 catch(e){

  return 0;

 }

}


function layerArea(layer){

 return areaFromGeoJSON(
  layer.toGeoJSON()
 );

}


/* ==================================================
   NÁZEV POLE NA MAPĚ
================================================== */

function updateFieldLabel(layer){

 if(
  !layer ||
  !layer.feature
 )
  return;


 const p=
 layer.feature.properties;


 try{

  layer.unbindTooltip();

 }
 catch(e){}


 let text=`

 <b>
  ${esc(p.name)}
 </b>

 `;


 if(p.currentCrop){

  text+=`

  <div class="crop">

   🌱 ${esc(p.currentCrop)}

  </div>

  `;

 }
 else{

  text+=`

  <div class="crop">

   ◻️ Bez plodiny

  </div>

  `;

 }


 layer.bindTooltip(
  text,
  {
   permanent:true,
   direction:'center',
   className:'field-label',
   interactive:false
  }
 );

}


/* ==================================================
   PŘÍPRAVA POLE
================================================== */

function prepareField(layer){

 if(!layer.feature){

  layer.feature={
   type:'Feature',
   properties:{}
  };

 }


 const p=
 layer.feature.properties;


 if(!p.id)
  p.id=uid();


 if(!p.name)
  p.name='Pole';


 if(!p.history)
  p.history=[];


 if(
  p.currentCrop===
  undefined
 ){

  p.currentCrop='';

 }


 p.area=
 layerArea(layer);


 layer.setStyle(
  fieldStyle(p)
 );


 updateFieldLabel(layer);


 layer.on(
  'click',
  function(e){

   if(splitMode)
    return;


   L.DomEvent.stopPropagation(e);


   openField(
    p.id
   );

  }
 );

}


/* ==================================================
   ULOŽENÍ
================================================== */

function save(){

 localStorage.setItem(
  'mojePoleData',
  JSON.stringify(
   fields.toGeoJSON()
  )
 );

}


/* ==================================================
   NAČTENÍ STARÝCH DAT
================================================== */

const oldData=
localStorage.getItem(
 'mojePoleData'
);


if(oldData){

 try{

  const data=
  JSON.parse(oldData);


  L.geoJSON(
   data,
   {

    onEachFeature:
    function(feature,layer){

     layer.feature=
     feature;


     if(
      !feature.properties.history
     ){

      feature.properties.history=[];

     }


     if(
      feature.properties.currentCrop===
      undefined
     ){

      feature.properties.currentCrop='';

     }


     prepareField(layer);

     fields.addLayer(layer);

    }

   }
  );

 }
 catch(err){

  console.error(err);

 }

}


/* ==================================================
   KRESLENÍ NOVÉHO POLE
================================================== */

const drawControl=
new L.Control.Draw({

 position:'topleft',

 edit:{
  featureGroup:fields
 },

 draw:{

  polygon:{

   allowIntersection:false,

   showArea:true,

   shapeOptions:{

    color:'#1769d2',

    weight:6,

    fillColor:'#777777',

    fillOpacity:.28

   }

  },

  rectangle:false,
  circle:false,
  circlemarker:false,
  marker:false,
  polyline:false

 }

});


map.addControl(
 drawControl
);


map.on(
 L.Draw.Event.CREATED,
 function(e){

  if(splitMode)
   return;


  const layer=
  e.layer;


  let name=
  prompt(
   'Název pole:',
   'Nové pole'
  );


  if(!name)
   name='Nové pole';


  layer.feature={

   type:'Feature',

   properties:{

    id:uid(),

    name:name,

    history:[],

    currentCrop:'',

    source:'manual'

   }

  };


  prepareField(layer);

  fields.addLayer(layer);


  save();


  openField(
   layer.feature.properties.id
  );

 }
);


map.on(
 L.Draw.Event.EDITED,
 function(e){

  e.layers.eachLayer(
   function(layer){

    layer.feature.properties.area=
    layerArea(layer);


    updateFieldLabel(
     layer
    );

   }
  );


  save();

 }
);


map.on(
 L.Draw.Event.DELETED,
 function(){

  save();

 }
);


/* ==================================================
   DETAIL POLE
================================================== */

function openField(id){

 const layer=
 findField(id);


 if(!layer)
  return;


 const p=
 layer.feature.properties;


 let cropHTML='';


 if(p.currentCrop){

  cropHTML=`

  <div
   class="cropCurrent"
   style="
   background:${cropColor(p.currentCrop)}55;
   border:1px solid ${cropColor(p.currentCrop)};
   ">

   🌱 ${esc(p.currentCrop)}

  </div>

  `;

 }
 else{

  cropHTML=`

  <div
   class="cropCurrent"
   style="
   background:#77777733;
   border:1px solid #888;
   ">

   ◻️ Bez plodiny / po sklizni

  </div>

  `;

 }


 let html=`

 <button
  class="back"
  onclick="openFields()">

  ← Všechna pole

 </button>


 <div class="card">

  <div class="fieldTitle">

   🌾 ${esc(p.name)}

  </div>


  <div class="area">

   ${formatNumber(p.area)} ha

  </div>


  ${cropHTML}


  <div class="actions">


   <button
    class="action split"
    onclick="startSplit('${p.id}')">

    <span>✂️</span>

    Rozdělit pole

   </button>


   <button
    class="action"
    onclick="recordForm('${p.id}','Setí')">

    <span>🌱</span>

    Setí

   </button>


   <button
    class="action"
    onclick="recordForm('${p.id}','Hnojení')">

    <span>🚜</span>

    Hnojení

   </button>


   <button
    class="action"
    onclick="recordForm('${p.id}','Postřik')">

    <span>💧</span>

    Postřik

   </button>


   <button
    class="action"
    onclick="recordForm('${p.id}','Sklizeň')">

    <span>🌾</span>

    Sklizeň

   </button>


  </div>

 </div>


 <div class="card">

  <h3>
   📋 Historie
  </h3>

  ${historyHTML(p)}

 </div>


 <div class="card">

  <button
   class="fullButton green"
   onclick="zoomField('${p.id}')">

   🗺️ Ukázat na mapě

  </button>


  <button
   class="fullButton"
   onclick="renameField('${p.id}')">

   ✏️ Přejmenovat

  </button>

 </div>

 `;


 showPanel(
  p.name,
  html
 );

}


/* ==================================================
   FORMULÁŘ
================================================== */

function recordForm(
 id,
 type
){

 const field=
 findField(id);


 if(!field)
  return;


 const p=
 field.feature.properties;


 let form='';


 /* ------------------------------
    SETÍ
 ------------------------------ */

 if(type==='Setí'){

  form=`

  <label>
   Co je zaseto?
  </label>


  <select id="product">

   <option value="">
    -- vyber plodinu --
   </option>

   <option value="Ječmen">
    Ječmen
   </option>

   <option value="Ječmen ozimý">
    Ječmen ozimý
   </option>

   <option value="Pšenice">
    Pšenice
   </option>

   <option value="Hrách">
    Hrách
   </option>

   <option value="Kukuřice">
    Kukuřice
   </option>

  </select>


  <label>
   Odrůda
  </label>


  <input
   id="variety"
   placeholder="Odrůda">


  <label>
   Výsevek
  </label>


  <input
   id="dose"
   type="number"
   step="0.01"
   inputmode="decimal">


  <label>
   Jednotka
  </label>


  <select id="unit">

   <option>kg/ha</option>

   <option>MJ/ha</option>

   <option>ks/ha</option>

  </select>

  `;

 }


 /* ------------------------------
    HNOJENÍ
 ------------------------------ */

 if(type==='Hnojení'){

  form=`

  <label>
   Hnojivo
  </label>


  <input
   id="product"
   placeholder="Hnůj, NPK, močovina…">


  <label>
   Dávka na hektar
  </label>


  <input
   id="dose"
   type="number"
   step="0.01"
   inputmode="decimal">


  <label>
   Jednotka
  </label>


  <select id="unit">

   <option>kg/ha</option>

   <option>t/ha</option>

   <option>l/ha</option>

  </select>

  `;

 }


 /* ------------------------------
    POSTŘIK
 ------------------------------ */

 if(type==='Postřik'){

  form=`

  <label>
   Přípravek
  </label>


  <input
   id="product"
   placeholder="Název přípravku">


  <label>
   Dávka na hektar
  </label>


  <input
   id="dose"
   type="number"
   step="0.001"
   inputmode="decimal">


  <label>
   Jednotka
  </label>


  <select id="unit">

   <option>l/ha</option>

   <option>kg/ha</option>

   <option>g/ha</option>

  </select>

  `;

 }


 /* ------------------------------
    SKLIZEŇ
 ------------------------------ */

 if(type==='Sklizeň'){

  form=`

  <div class="notice">

   🌾 Po uložení sklizně se pole
   automaticky přepne zpět na
   <b>šedou barvu</b>.

  </div>


  <label>
   Sklizená plodina
  </label>


  <input
   id="product"
   value="${esc(p.currentCrop||'')}"
   placeholder="Pšenice">


  <label>
   Výnos
  </label>


  <input
   id="dose"
   type="number"
   step="0.01"
   inputmode="decimal">


  <label>
   Jednotka
  </label>


  <select id="unit">

   <option>t/ha</option>

   <option>kg/ha</option>

  </select>

  `;

 }


 const html=`

 <button
  class="back"
  onclick="openField('${id}')">

  ← Zpět

 </button>


 <div class="card">


  <div class="area">

   ${formatNumber(p.area)} ha

  </div>


  <label>
   Datum
  </label>


  <input
   id="date"
   type="date"
   value="${today()}">


  ${form}


  <label>
   Poznámka
  </label>


  <textarea
   id="note"
   placeholder="Volitelná poznámka">
  </textarea>


  <button
   class="fullButton green"
   onclick="saveRecord('${id}','${type}')">

   💾 Uložit

  </button>


 </div>

 `;


 showPanel(
  icon(type)+' '+type,
  html
 );

}


/* ==================================================
   ULOŽIT ZÁZNAM

   ZDE JE HLAVNÍ ZMĚNA:
   SETÍ = BARVA PLODINY
   SKLIZEŇ = ŠEDÁ
================================================== */

function saveRecord(
 id,
 type
){

 const field=
 findField(id);


 if(!field)
  return;


 const p=
 field.feature.properties;


 const product=
 document
 .getElementById('product')
 ?.value.trim()||'';


 if(!product){

  alert(
   type==='Setí'
   ? 'Vyber plodinu.'
   : 'Vyplň název.'
  );

  return;

 }


 const rawDose=
 document
 .getElementById('dose')
 ?.value||'';


 const dose=
 parseFloat(
  String(rawDose)
  .replace(',','.')
 );


 const record={

  id:uid(),

  type:type,

  date:
  document
  .getElementById('date')
  .value,

  product:product,

  variety:
  document
  .getElementById('variety')
  ?.value.trim()||'',

  dose:
  isNaN(dose)
  ?
  null
  :
  dose,

  unit:
  document
  .getElementById('unit')
  ?.value||'',

  note:
  document
  .getElementById('note')
  .value.trim(),

  targetArea:
  Number(p.area)

 };


 if(!p.history)
  p.history=[];


 p.history.push(
  record
 );


 /* ==================================================
    KDYŽ JE SETÍ
    nastavíme plodinu
 ================================================== */

 if(type==='Setí'){

  p.currentCrop=
  product;

 }


 /* ==================================================
    KDYŽ JE SKLIZEŇ
    odstraníme aktuální plodinu

    tím se pole vrátí na šedou
 ================================================== */

 if(type==='Sklizeň'){

  p.currentCrop='';

 }


 /* PŘEKRESLIT POLE */

 field.setStyle(
  fieldStyle(p)
 );


 /* PŘEKRESLIT NÁZEV */

 updateFieldLabel(
  field
 );


 /* ULOŽIT */

 save();


 /* ZPĚT NA DETAIL */

 openField(id);

}

   );

/* ==================================================
   PŘICHYCENÍ K HRANICI
================================================== */

function snapToFieldBoundary(
 fieldLayer,
 latlng
){

 try{

  const polygon=
  fieldLayer.toGeoJSON();


  const boundary=
  turf.polygonToLine(
   polygon
  );


  const point=
  turf.point(
   [
    latlng.lng,
    latlng.lat
   ]
  );


  let snapped=null;


  if(
   boundary.type===
   'FeatureCollection'
  ){

   let best=
   Infinity;


   boundary.features.forEach(
    function(line){

     const candidate=
     turf.nearestPointOnLine(
      line,
      point,
      {
       units:'meters'
      }
     );


     const d=
     Number(
      candidate.properties.dist
     );


     if(d<best){

      best=d;

      snapped=
      candidate;

     }

    }
   );

  }
  else{

   snapped=
   turf.nearestPointOnLine(
    boundary,
    point,
    {
     units:'meters'
    }
   );

  }


  if(!snapped)
   return null;


  const c=
  snapped.geometry.coordinates;


  return L.latLng(
   c[1],
   c[0]
  );

 }
 catch(err){

  console.error(err);

  return null;

 }

}

/* ==================================================
   ROZDĚLENÍ
================================================== */

function performSplit(){

 const field=
 findField(
  splitFieldId
 );


 if(
  !field ||
  splitClicks.length!==2
 )
  return;


 try{

  const original=
  field.toGeoJSON();


  const A=[
   splitClicks[0].lng,
   splitClicks[0].lat
  ];


  const B=[
   splitClicks[1].lng,
   splitClicks[1].lat
  ];


  const results=
  splitPolygonByBoundaryPoints(
   original,
   A,
   B
  );


  if(
   !results ||
   results.length!==2
  ){

   alert(
    'Tímto směrem se pole nepodařilo rozdělit. Zkus dělicí čáru znovu.'
   );


   resetSplit();

   return;

  }


  const oldProps=
  JSON.parse(
   JSON.stringify(
    field.feature.properties
   )
  );


  const area1=
  areaFromGeoJSON(
   results[0]
  );


  const area2=
  areaFromGeoJSON(
   results[1]
  );


  if(
   area1<0.001 ||
   area2<0.001
  ){

   alert(
    'Jedna část je příliš malá.'
   );


   resetSplit();

   return;

  }


  const nameA=
  prompt(
   'Název první části:',
   oldProps.name+' A'
  );


  if(
   nameA===null
  ){

   resetSplit();

   return;

  }


  const nameB=
  prompt(
   'Název druhé části:',
   oldProps.name+' B'
  );


  if(
   nameB===null
  ){

   resetSplit();

   return;

  }


  fields.removeLayer(
   field
  );


  addSplitField(
   results[0],
   nameA||
   oldProps.name+' A',
   oldProps
  );


  addSplitField(
   results[1],
   nameB||
   oldProps.name+' B',
   oldProps
  );


  save();


  finishSplitMode();


  alert(

   '✅ Pole rozděleno\n\n'+

   (nameA||
    oldProps.name+' A')+

   ': '+

   formatNumber(area1)+

   ' ha\n'+

   (nameB||
    oldProps.name+' B')+

   ': '+

   formatNumber(area2)+

   ' ha'

  );


  openFields();

 }
 catch(err){

  console.error(err);


  alert(
   'Pole se nepodařilo rozdělit.'
  );


  resetSplit();

 }

}


/* ==================================================
   GEOMETRIE DĚLENÍ
================================================== */

function splitPolygonByBoundaryPoints(
 feature,
 A,
 B
){

 if(
  !feature ||
  !feature.geometry ||
  feature.geometry.type!==
  'Polygon'
 ){

  return null;

 }


 let ring=
 feature.geometry.coordinates[0]
 .map(
  c=>[
   c[0],
   c[1]
  ]
 );


 if(
  sameCoord(
   ring[0],
   ring[ring.length-1]
  )
 ){

  ring.pop();

 }


 let insertedA=
 insertPointIntoRing(
  ring,
  A
 );


 ring=
 insertedA.ring;


 let insertedB=
 insertPointIntoRing(
  ring,
  B
 );


 ring=
 insertedB.ring;


 const indexA=
 findCoordinateIndex(
  ring,
  A
 );


 const indexB=
 findCoordinateIndex(
  ring,
  B
 );


 if(
  indexA<0 ||
  indexB<0 ||
  indexA===indexB
 ){

  return null;

 }


 const path1=
 pathAroundRing(
  ring,
  indexA,
  indexB
 );


 const path2=
 pathAroundRing(
  ring,
  indexB,
  indexA
 );


 if(
  path1.length<2 ||
  path2.length<2
 ){

  return null;

 }


 const ring1=
 path1.map(
  copyCoord
 );


 const ring2=
 path2.map(
  copyCoord
 );


 ring1.push(
  copyCoord(
   ring1[0]
  )
 );


 ring2.push(
  copyCoord(
   ring2[0]
  )
 );


 const poly1=
 turf.cleanCoords(
  turf.polygon(
   [ring1]
  )
 );


 const poly2=
 turf.cleanCoords(
  turf.polygon(
   [ring2]
  )
 );


 if(
  turf.area(poly1)<=0 ||
  turf.area(poly2)<=0
 ){

  return null;

 }


 return[
  poly1,
  poly2
 ];

}


/* ==================================================
   VLOŽENÍ BODU DO HRANICE
================================================== */

function insertPointIntoRing(
 ring,
 point
){

 let bestIndex=0;

 let bestDistance=
 Infinity;


 const p=
 turf.point(
  point
 );


 for(
  let i=0;
  i<ring.length;
  i++
 ){

  const j=
  (i+1)%ring.length;


  const line=
  turf.lineString(
   [
    ring[i],
    ring[j]
   ]
  );


  const snapped=
  turf.nearestPointOnLine(
   line,
   p,
   {
    units:'meters'
   }
  );


  const d=
  Number(
   snapped.properties.dist
  );


  if(
   d<bestDistance
  ){

   bestDistance=d;

   bestIndex=i;

  }

 }


 const result=
 ring.map(
  copyCoord
 );


 const existing=
 findCoordinateIndex(
  result,
  point
 );


 if(
  existing>=0
 ){

  return{
   ring:result,
   index:existing
  };

 }


 result.splice(
  bestIndex+1,
  0,
  copyCoord(point)
 );


 return{
  ring:result,
  index:bestIndex+1
 };

}


/* ==================================================
   CESTA PO HRANICI
================================================== */

function pathAroundRing(
 ring,
 start,
 end
){

 const result=[];

 let i=start;

 let safety=0;


 while(true){

  result.push(
   copyCoord(
    ring[i]
   )
  );


  if(
   i===end
  )
   break;


  i=
  (i+1)%ring.length;


  safety++;


  if(
   safety>
   ring.length+2
  )
   return[];

 }


 return result;

}

 feature,
 name,
 oldProps
){

 feature.properties={

  history:
  JSON.parse(
   JSON.stringify(
    oldProps.history||[]
   )
  ),

  currentCrop:
  oldProps.currentCrop||'',

  source:'split',

  parentName:
  oldProps.name,

  splitDate:
  today()

 };


 L.geoJSON(
  feature,
  {

   onEachFeature:
   function(f,layer){

    layer.feature=f;


    prepareField(
     layer
    );


    fields.addLayer(
     layer
    );

   }

 );

}

 .sort(

  .localeCompare(
   String(a.date||'')
  )
 );


 if(
  !history.length
 ){

  return`

  <div class="small">

   Zatím bez záznamů.

  </div>

  `;

 }


 let html='';


 history.forEach(
  function(r){

   if(
    r.text &&
    !r.product
   ){

    html+=`

    <div class="history">

     <b>

      ${icon(r.type)}
      ${esc(r.type)}

     </b>

     <br>

     ${esc(r.text)}

     <div class="small">

      📅 ${formatDate(r.date)}

     </div>

    </div>

    `;


    return;

   }


   const area=
   Number(
    r.targetArea||
    p.area
   );


   let total='';


   if(
    r.dose!==null &&
    r.dose!==undefined
   ){

    .replace(
     '/ha',
     ''
    );


    total=`

     Celkem:
     ${formatNumber(amount)}
     ${esc(unit)}

    </div>

    `;

   }


   html+=`

   <div class="history">

    <b>

     ${icon(r.type)}
     ${esc(r.type)}

    </b>

    <br>

    ${esc(r.product||'')}


    ${
     r.variety
     ?
     ' – '+esc(r.variety)
     :
     ''
    }


    ${
     r.dose!==null &&
     r.dose!==undefined
     ?
     `
     <div>

      ${formatNumber(r.dose)}
      ${esc(r.unit)}

     </div>
     `
     :
     ''
    }


    ${total}


    <div class="small">

     📅 ${formatDate(r.date)}

     •

     ${formatNumber(area)} ha

    </div>


    ${
     r.note
     ?
     `
     <div class="small">

      📝 ${esc(r.note)}

     </div>
     `
     :
     ''
    }


   </div>

   `;

  }
 );


 return html;

}

    );

  );

);


/* ==================================================
   POMOCNÉ FUNKCE
================================================== */

function copyCoord(c){

 return[
  Number(c[0]),
  Number(c[1])
 ];

}


function sameCoord(
 a,
 b
){

 if(
  !a ||
  !b
 )
  return false;


 return(
  Math.abs(
   a[0]-b[0]
  )<
  0.000000001
  &&
  Math.abs(
   a[1]-b[1]
  )<
  0.000000001
 );

}


function findCoordinateIndex(
 ring,
 point
){

 for(
  let i=0;
  i<ring.length;
  i++
 ){

  if(
   sameCoord(
    ring[i],
    point
   )
  ){

   return i;

  }

 }


 return -1;

}


function uid(){

 return(
  Date.now()
  .toString()
  +
  Math.random()
  .toString(36)
  .slice(2,8)
 );

}


function today(){

 return new Date()
 .toISOString()
 .slice(0,10);

}


function icon(type){

 if(
  type==='Setí'
 )
  return'🌱';


 if(
  type==='Hnojení'
 )
  return'🚜';


 if(
  type==='Postřik'
 )
  return'💧';


 if(
  type==='Sklizeň'
 )
  return'🌾';


 return'📝';

}


function formatNumber(n){

 return Number(
  n||0
 )
 .toLocaleString(
  'cs-CZ',
  {
   maximumFractionDigits:2
  }
 );

}


function formatDate(d){

 if(!d)
  return'';


 const x=
 d.split('-');


 if(
  x.length!==3
 )
  return d;


 return(
  x[2]+'. '+
  x[1]+'. '+
  x[0]
 );

}


function esc(value){

 return String(
  value??''
 )
 .replaceAll(
  '&',
  '&amp;'
 )
 .replaceAll(
  '<',
  '&lt;'
 )
 .replaceAll(
  '>',
  '&gt;'
 )
 .replaceAll(
  '"',
  '&quot;'
 );

}

){

   }
  );

 catch(e){}
