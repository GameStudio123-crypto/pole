<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#173f2a">

<title>Moje pole</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">

<style>

:root{
 --green:#1f5c3a;
 --green2:#2f7650;
 --light:#f3f6f2;
 --border:#dfe7df;
 --text:#18251d;
 --muted:#6d7c72;
 --orange:#c87824;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 height:100%;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 color:var(--text);
 background:var(--light);
}

button,input,select,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

#map{
 position:absolute;
 inset:0;
}

/* LEAFLET OVLÁDÁNÍ */

.leaflet-top.leaflet-left{
 top:82px;
 left:8px;
}

.leaflet-top.leaflet-right{
 top:82px;
 right:8px;
}

/* HLAVIČKA */

.header{
 position:absolute;
 top:0;
 left:0;
 right:0;
 z-index:1500;
 padding:
  calc(10px + env(safe-area-inset-top))
  12px
  10px;
 pointer-events:none;
}

.headerInner{
 max-width:900px;
 margin:auto;
 height:58px;
 background:rgba(255,255,255,.96);
 border-radius:18px;
 box-shadow:0 5px 20px rgba(0,0,0,.18);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:8px 10px 8px 15px;
 pointer-events:auto;
 backdrop-filter:blur(10px);
}

.brand{
 display:flex;
 align-items:center;
 gap:9px;
 font-weight:800;
 font-size:19px;
}

.brandIcon{
 width:39px;
 height:39px;
 border-radius:12px;
 background:var(--green);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:22px;
}

.headerButtons{
 display:flex;
 gap:7px;
}

.headerBtn{
 border:0;
 border-radius:12px;
 padding:10px 12px;
 font-weight:700;
 background:#eaf1eb;
 color:var(--green);
}

.headerBtn.primary{
 background:var(--green);
 color:white;
}

/* SPODNÍ INFO */

.mapHint{
 position:absolute;
 z-index:1000;
 left:50%;
 transform:translateX(-50%);
 bottom:
  calc(16px + env(safe-area-inset-bottom));
 background:rgba(24,37,29,.90);
 color:white;
 padding:9px 14px;
 border-radius:20px;
 font-size:13px;
 box-shadow:0 3px 12px rgba(0,0,0,.25);
 max-width:85%;
 text-align:center;
 pointer-events:none;
}

/* PANEL */

.panel{
 position:fixed;
 z-index:5000;
 display:none;
 background:#f5f7f4;
 overflow:auto;
 left:0;
 right:0;
 bottom:0;
 max-height:90vh;
 border-radius:24px 24px 0 0;
 box-shadow:0 -7px 35px rgba(0,0,0,.30);
 padding-bottom:env(safe-area-inset-bottom);
}

.panel.open{
 display:block;
}

.panelHeader{
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(31,92,58,.97);
 color:white;
 min-height:63px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 15px;
 backdrop-filter:blur(10px);
}

.panelHeader h2{
 font-size:19px;
 margin:0;
}

.close{
 width:38px;
 height:38px;
 border:0;
 border-radius:50%;
 background:white;
 color:var(--green);
 font-size:22px;
 font-weight:bold;
}

.content{
 padding:14px;
}

.card{
 background:white;
 border:1px solid var(--border);
 border-radius:17px;
 padding:15px;
 margin-bottom:12px;
 box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.fieldTitle{
 font-size:24px;
 font-weight:800;
}

.area{
 font-size:19px;
 color:var(--green);
 font-weight:700;
 margin-top:5px;
}

.muted{
 color:var(--muted);
 font-size:13px;
 margin-top:5px;
}

/* TLAČÍTKA */

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}

.action{
 min-height:86px;
 border:1px solid var(--border);
 border-radius:15px;
 background:#f5f8f5;
 font-weight:750;
 font-size:15px;
 padding:11px 5px;
 color:var(--text);
}

.action span{
 display:block;
 font-size:27px;
 margin-bottom:5px;
}

.action.split{
 background:#fff4e8;
 border-color:#f0d0aa;
 color:#8a4b0b;
}

.green{
 background:var(--green)!important;
 color:white!important;
 border-color:var(--green)!important;
}

.blue{
 background:#35668c!important;
 color:white!important;
}

.orange{
 background:var(--orange)!important;
 color:white!important;
}

.fullButton{
 width:100%;
 border:0;
 border-radius:12px;
 padding:14px;
 margin-top:10px;
 font-weight:750;
 font-size:16px;
}

.back{
 border:0;
 background:#e5ece6;
 color:var(--green);
 border-radius:10px;
 padding:9px 12px;
 font-weight:700;
 margin-bottom:11px;
}

/* FORM */

label{
 display:block;
 font-weight:700;
 margin:14px 0 5px;
}

input,select,textarea{
 width:100%;
 border:1px solid #cbd5cd;
 background:white;
 border-radius:11px;
 padding:12px;
 font-size:16px;
}

textarea{
 min-height:80px;
 resize:vertical;
}

/* HISTORIE */

.history{
 border-left:5px solid #6d9b78;
 background:#f5f8f4;
 border-radius:9px;
 padding:11px 12px;
 margin:9px 0;
}

.total{
 color:var(--green);
 font-weight:800;
 margin-top:5px;
}

.small{
 color:var(--muted);
 font-size:13px;
 margin-top:4px;
}

/* SEZNAM POLÍ */

.fieldButton{
 display:block;
 width:100%;
 text-align:left;
 border:1px solid var(--border);
 background:white;
 padding:14px;
 border-radius:13px;
 margin-bottom:8px;
}

.fieldButton b{
 font-size:17px;
}

/* OSEVNÍ ČÁSTI */

.part{
 border-radius:13px;
 padding:13px;
 margin:9px 0;
 background:#eef5ed;
 border:1px solid #d7e5d5;
}

.partTitle{
 font-size:17px;
 font-weight:800;
}

.partArea{
 color:var(--green);
 font-weight:800;
 margin-top:3px;
}

.partButtons{
 display:flex;
 gap:7px;
 margin-top:9px;
}

.miniButton{
 border:0;
 border-radius:8px;
 padding:8px 10px;
 font-weight:700;
}

.delete{
 background:#f6e4e2;
 color:#a03932;
}

.zoom{
 background:#e4eee6;
 color:var(--green);
}

.notice{
 background:#fff6d9;
 border:1px solid #eedda2;
 padding:11px;
 border-radius:11px;
 font-size:14px;
 margin-bottom:11px;
}

.drawNotice{
 background:#e8f3ea;
 border:1px solid #c4dec9;
 padding:12px;
 border-radius:12px;
 line-height:1.45;
}

.yearTitle{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:7px;
}

.badge{
 background:#e5eee6;
 color:var(--green);
 padding:5px 8px;
 border-radius:9px;
 font-size:12px;
 font-weight:800;
}

/* BAR */

.bar{
 height:14px;
 background:#e2e5e2;
 border-radius:10px;
 overflow:hidden;
 margin:10px 0 4px;
}

.barInside{
 height:100%;
 background:#6e9a72;
}

/* TABLET */

@media(min-width:760px){

 .panel{
  left:auto;
  right:18px;
  bottom:18px;
  width:510px;
  max-height:88vh;
  border-radius:24px;
 }

 .header{
  padding-top:12px;
 }

}

</style>
</head>

<body>

<div id="map"></div>

<div class="header">
 <div class="headerInner">

  <div class="brand">
   <div class="brandIcon">🚜</div>
   <div>Moje pole</div>
  </div>

  <div class="headerButtons">

   <button
    class="headerBtn"
    onclick="locateMe()">
    📍
   </button>

   <button
    class="headerBtn primary"
    onclick="openFields()">
    ☰ Pole
   </button>

  </div>

 </div>
</div>

<div id="mapHint" class="mapHint">
✏️ Nástroje pro kreslení jsou vlevo
</div>

<div id="panel" class="panel">

 <div class="panelHeader">

  <h2 id="panelTitle">
   Moje pole
  </h2>

  <button
   class="close"
   onclick="closePanel()">
   ×
  </button>

 </div>

 <div
  id="panelContent"
  class="content">
 </div>

</div>

<input
 type="file"
 id="importFile"
 accept=".json,application/json"
 style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

<script>

/* ==================================================
   MAPA
================================================== */

const map=L.map(
 'map',
 {
  zoomControl:true
 }
).setView(
 [49.55,16.95],
 13
);

const satellite=L.tileLayer(

 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',

 {
  maxZoom:20,
  attribution:'Esri'
 }

);

const normal=L.tileLayer(

 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

 {
  maxZoom:20,
  attribution:'© OpenStreetMap'
 }

);

satellite.addTo(map);


/* ==================================================
   ČÚZK
================================================== */

const katastr=L.tileLayer.wms(

 'https://services.cuzk.gov.cz/wms/local-km-wms.asp',

 {
  layers:'hranice_parcel,parcelni_cisla',
  format:'image/png',
  transparent:true,
  version:'1.3.0',
  maxZoom:22,
  attribution:'ČÚZK'
 }

);

katastr.addTo(map);

L.control.layers(

 {
  '🛰️ Letecká mapa':satellite,
  '🗺️ Klasická mapa':normal
 },

 {
  '📐 Katastr ČÚZK':katastr
 },

 {
  position:'topright'
 }

).addTo(map);


/* ==================================================
   HLAVNÍ POLE
================================================== */

const fields=
new L.FeatureGroup();

map.addLayer(fields);


/* ==================================================
   OSEVNÍ ČÁSTI NA MAPĚ
================================================== */

const cropParts=
new L.FeatureGroup();

map.addLayer(cropParts);

let drawingPartForField=null;


/* ==================================================
   VÝPOČET PLOCHY
================================================== */

function polygonArea(points){

 if(!points || points.length<3)
  return 0;

 const R=6378137;

 let area=0;

 for(let i=0;i<points.length;i++){

  const p1=points[i];
  const p2=points[(i+1)%points.length];

  area+=
   (p2.lng-p1.lng)*
   Math.PI/180*
   (
    2+
    Math.sin(p1.lat*Math.PI/180)+
    Math.sin(p2.lat*Math.PI/180)
   );
 }

 return Math.abs(
  area*R*R/2
 )/10000;
}


function layerArea(layer){

 let pts=layer.getLatLngs();

 while(
  Array.isArray(pts[0]) &&
  !(pts[0] instanceof L.LatLng)
 ){
  pts=pts[0];
 }

 return polygonArea(pts);
}


/* ==================================================
   PŘÍPRAVA HLAVNÍHO POLE
================================================== */

function prepareField(layer){

 if(!layer.feature){

  layer.feature={
   type:'Feature',
   properties:{}
  };

 }

 const p=
 layer.feature.properties;

 if(!p.id)
  p.id=uid();

 if(!p.name)
  p.name='Pole';

 if(!p.history)
  p.history=[];

 if(!p.parts)
  p.parts=[];

 if(!p.area)
  p.area=layerArea(layer);


 layer.setStyle({
  weight:3,
  opacity:1,
  fillOpacity:.14
 });


 layer.on(
  'click',
  function(){

   if(drawingPartForField)
    return;

   openField(p.id);

  }
 );

}


/* ==================================================
   ULOŽENÍ
================================================== */

function save(){

 localStorage.setItem(
  'mojePoleData',
  JSON.stringify(
   fields.toGeoJSON()
  )
 );

}


/* ==================================================
   NAČTENÍ
================================================== */

const saved=
localStorage.getItem(
 'mojePoleData'
);

if(saved){

 try{

  const data=
  JSON.parse(saved);

  L.geoJSON(

   data,

   {

    onEachFeature:
    function(feature,layer){

     layer.feature=feature;

     if(!feature.properties.history)
      feature.properties.history=[];

     if(!feature.properties.parts)
      feature.properties.parts=[];

     prepareField(layer);

     fields.addLayer(layer);

    }

   }

  );

 }
 catch(err){

  console.error(err);

 }

}


/* ==================================================
   VYKRESLENÍ OSEVNÍCH ČÁSTÍ
================================================== */

function refreshCropParts(){

 cropParts.clearLayers();

 fields.eachLayer(
  function(fieldLayer){

   const p=
   fieldLayer.feature.properties;

   (p.parts||[]).forEach(
    function(part){

     if(
      !part.geometry ||
      !part.geometry.coordinates
     ){
      return;
     }

     const feature={
      type:'Feature',
      geometry:part.geometry,
      properties:{}
     };

     const layer=
     L.geoJSON(
      feature,
      {
       style:{
        weight:2,
        fillOpacity:.36,
        dashArray:'5,4'
       }
      }
     );

     layer.eachLayer(
      function(child){

       child.bindTooltip(
        '🌱 '+part.crop+
        '<br>'+
        formatNumber(part.area)+
        ' ha',
        {
         sticky:true
        }
       );

       child.on(
        'click',
        function(e){

         L.DomEvent.stopPropagation(e);

         openField(p.id);

        }
       );

      }
     );

     layer.addTo(cropParts);

    }
   );

  }
 );

}

refreshCropParts();


/* ==================================================
   RUČNÍ KRESLENÍ NOVÉHO POLE
================================================== */

const drawControl=
new L.Control.Draw({

 position:'topleft',

 edit:{
  featureGroup:fields
 },

 draw:{

  polygon:{
   allowIntersection:false,
   showArea:true
  },

  rectangle:false,
  circle:false,
  circlemarker:false,
  marker:false,
  polyline:false

 }

});

map.addControl(drawControl);


map.on(
 L.Draw.Event.CREATED,
 function(e){

  const layer=e.layer;


  /* kreslíme část uvnitř pole */

  if(drawingPartForField){

   finishCropPart(
    drawingPartForField,
    layer
   );

   drawingPartForField=null;

   document
   .getElementById('mapHint')
   .textContent=
   '✏️ Nástroje pro kreslení jsou vlevo';

   return;
  }


  /* normální nové pole */

  let name=
  prompt(
   'Jak se pole jmenuje?',
   'Nové pole'
  );

  if(!name)
   name='Nové pole';


  layer.feature={

   type:'Feature',

   properties:{

    id:uid(),

    name:name,

    area:layerArea(layer),

    history:[],

    parts:[],

    source:'manual'

   }

  };


  prepareField(layer);

  fields.addLayer(layer);

  save();

  openField(
   layer.feature.properties.id
  );

 }
);


map.on(
 L.Draw.Event.EDITED,
 function(e){

  e.layers.eachLayer(
   function(layer){

    layer.feature.properties.area=
    layerArea(layer);

   }
  );

  save();

 }
);


map.on(
 L.Draw.Event.DELETED,
 function(){

  save();

  refreshCropParts();

 }
);


/* ==================================================
   DETAIL POLE
================================================== */

function openField(id){

 const layer=
 findField(id);

 if(!layer)return;

 const p=
 layer.feature.properties;

 const currentYear=
 new Date().getFullYear();

 const parts=
 (p.parts||[])
 .filter(
  x=>
  Number(x.year)===
  currentYear
 );


 let html=`

 <button
  class="back"
  onclick="openFields()">
  ← Všechna pole
 </button>


 <div class="card">

  <div class="fieldTitle">
   🌾 ${esc(p.name)}
  </div>

  <div class="area">
   ${formatNumber(p.area)} ha
  </div>

  <div class="muted">
   ${parts.length
    ? '✂️ '+parts.length+
      ' osevních částí v roce '+
      currentYear
    : 'Pole zatím není letos rozdělené'}
  </div>


  <div class="actions">

   <button
    class="action split"
    onclick="openParts('${id}')">

    <span>✂️</span>
    Rozdělit pole

   </button>


   <button
    class="action"
    onclick="recordForm('${id}','Setí')">

    <span>🌱</span>
    Setí

   </button>


   <button
    class="action"
    onclick="recordForm('${id}','Hnojení')">

    <span>🚜</span>
    Hnojení

   </button>


   <button
    class="action"
    onclick="recordForm('${id}','Postřik')">

    <span>💧</span>
    Postřik

   </button>


   <button
    class="action"
    onclick="recordForm('${id}','Sklizeň')">

    <span>🌾</span>
    Sklizeň

   </button>

  </div>

 </div>


 <div class="card">

  <h3>📋 Historie</h3>

  ${historyHTML(p)}

 </div>


 <div class="card">

  <button
   class="fullButton green"
   onclick="zoomField('${id}')">
   🗺️ Ukázat pole na mapě
  </button>

  <button
   class="fullButton"
   onclick="renameField('${id}')">
   ✏️ Přejmenovat pole
  </button>

 </div>

 `;

 showPanel(
  p.name,
  html
 );

}


/* ==================================================
   ROZDĚLENÍ POLE
================================================== */

function openParts(id){

 const layer=
 findField(id);

 if(!layer)return;

 const p=
 layer.feature.properties;

 if(!p.parts)
  p.parts=[];

 const years=[
  ...new Set(
   p.parts.map(
    x=>Number(x.year)
   )
  )
 ];

 const currentYear=
 new Date().getFullYear();

 if(!years.includes(currentYear))
  years.push(currentYear);

 years.sort(
  (a,b)=>b-a
 );


 let html=`

 <button
  class="back"
  onclick="openField('${id}')">
  ← Zpět
 </button>


 <div class="card">

  <div class="fieldTitle">
   ✂️ Osevní části
  </div>

  <div class="area">
   ${formatNumber(p.area)} ha
  </div>

  <div class="drawNotice">

   <b>Jak to funguje:</b><br>

   Stiskni tlačítko níže.
   Panel se zavře a na mapě
   nakreslíš hranici části pole.

   <br><br>

   Aplikace sama spočítá
   její výměru.

  </div>


  <button
   class="fullButton orange"
   onclick="startDrawPart('${id}')">

   ✏️ Nakreslit osevní část na mapě

  </button>

 </div>

 `;


 years.forEach(
  function(year){

   const yearParts=
   p.parts.filter(
    x=>Number(x.year)===year
   );


   if(!yearParts.length)
    return;


   const total=
   yearParts.reduce(
    (s,x)=>
    s+Number(x.area||0),
    0
   );


   const percent=
   Math.min(
    100,
    (total/Number(p.area))*100
   );


   html+=`

   <div class="card">

    <div class="yearTitle">

     <h3 style="margin:0">
      📅 ${year}
     </h3>

     <div class="badge">
      ${formatNumber(total)} ha
     </div>

    </div>


    <div class="bar">

     <div
      class="barInside"
      style="width:${percent}%">
     </div>

    </div>


    <div class="small">

     Z celého pole:
     ${formatNumber(total)}
     /
     ${formatNumber(p.area)}
     ha

    </div>

   `;


   yearParts.forEach(
    function(part){

     html+=`

     <div class="part">

      <div class="partTitle">
       🌱 ${esc(part.crop)}
      </div>

      ${
       part.variety
       ?
       `<div class="small">
        Odrůda:
        ${esc(part.variety)}
        </div>`
       :
       ''
      }

      ${
       part.name
       ?
       `<div class="small">
        📍 ${esc(part.name)}
        </div>`
       :
       ''
      }

      <div class="partArea">
       ${formatNumber(part.area)} ha
      </div>


      <div class="partButtons">

       <button
        class="miniButton zoom"
        onclick="
        zoomPart(
         '${id}',
         '${part.id}'
        )">

        🗺️ Ukázat

       </button>


       <button
        class="miniButton delete"
        onclick="
        deletePart(
         '${id}',
         '${part.id}'
        )">

        🗑️ Smazat

       </button>

      </div>

     </div>

     `;

   }
  );


  html+=`
   </div>
  `;

 });


 showPanel(
  '✂️ Rozdělení pole',
  html
 );

}


/* ==================================================
   ZAČÍT KRESLIT ČÁST
================================================== */

function startDrawPart(fieldId){

 const field=
 findField(fieldId);

 if(!field)return;


 drawingPartForField=
 fieldId;


 closePanel();


 map.fitBounds(
  field.getBounds(),
  {
   padding:[35,35]
  }
 );


 document
 .getElementById('mapHint')
 .textContent=
 '✂️ Nakresli polygon kolem osevní části';


 setTimeout(
  function(){

   new L.Draw.Polygon(
    map,
    {
     allowIntersection:false,
     showArea:true,
     shapeOptions:{
      weight:3,
      dashArray:'6,4',
      fillOpacity:.25
     }
    }
   ).enable();

  },
  300
 );

}


/* ==================================================
   DOKONČENÍ ČÁSTI
================================================== */

function finishCropPart(
 fieldId,
 layer
){

 const field=
 findField(fieldId);

 if(!field)
  return;


 const p=
 field.feature.properties;


 const yearText=
 prompt(
  'Pro který rok je tato část?',
  new Date().getFullYear()
 );


 if(yearText===null)
  return;


 const year=
 parseInt(yearText);


 if(
  isNaN(year) ||
  year<2000 ||
  year>2100
 ){

  alert(
   'Neplatný rok.'
  );

  return;

 }


 const crop=
 prompt(
  'Co je na této části zaseto?',
  'Pšenice'
 );


 if(!crop)
  return;


 const name=
 prompt(
  'Název části (volitelné):',
  ''
 )||'';


 const variety=
 prompt(
  'Odrůda (volitelné):',
  ''
 )||'';


 const area=
 layerArea(layer);


 if(!p.parts)
  p.parts=[];


 p.parts.push({

  id:uid(),

  year:year,

  crop:crop,

  name:name,

  variety:variety,

  area:area,

  geometry:
   layer.toGeoJSON().geometry

 });


 save();

 refreshCropParts();


 alert(
  '✅ Část uložena\n\n'+
  crop+
  '\n'+
  formatNumber(area)+
  ' ha'
 );


 openParts(fieldId);

}


/* ==================================================
   SMAZAT ČÁST
================================================== */

function deletePart(
 fieldId,
 partId
){

 const field=
 findField(fieldId);

 if(!field)return;


 if(!confirm(
  'Smazat tuto osevní část?'
 ))
  return;


 const p=
 field.feature.properties;


 p.parts=
 (p.parts||[])
 .filter(
  x=>
  String(x.id)!==
  String(partId)
 );


 save();

 refreshCropParts();

 openParts(fieldId);

}


/* ==================================================
   ZOOM ČÁST
================================================== */

function zoomPart(
 fieldId,
 partId
){

 const field=
 findField(fieldId);

 if(!field)return;


 const part=
 (field.feature.properties.parts||[])
 .find(
  x=>
  String(x.id)===
  String(partId)
 );


 if(
  !part ||
  !part.geometry
 )
  return;


 const layer=
 L.geoJSON({
  type:'Feature',
  geometry:part.geometry
 });


 closePanel();


 map.fitBounds(
  layer.getBounds(),
  {
   padding:[60,60]
  }
 );

}

/* ==================================================
   ULOŽIT ZÁSAH
================================================== */

function saveRecord(
 id,
 type
){

 const field=
 findField(id);

 if(!field)return;


 const p=
 field.feature.properties;


 const product=
 document
 .getElementById('product')
 ?.value.trim()||'';


 if(!product){

  alert(
   'Vyplň název.'
  );

  return;

 }


 const raw=
 document
 .getElementById('dose')
 ?.value||'';


 const dose=
 parseFloat(
  String(raw)
  .replace(',','.')
 );


 const partId=
 document
 .getElementById('targetPart')
 ?.value||'';


 let targetArea=
 Number(p.area);

 let targetName=
 'Celé pole';


 if(partId){

  const part=
  (p.parts||[])
  .find(
   x=>
   String(x.id)===
   String(partId)
  );


  if(part){

   targetArea=
   Number(part.area);

   targetName=
   part.crop+
   (
    part.name
    ?
    ' – '+part.name
    :
    ''
   );

  }

 }


 const record={

  id:uid(),

  type:type,

  date:
   document
   .getElementById('date')
   .value,

  product:product,

  variety:
   document
   .getElementById('variety')
   ?.value.trim()||'',

  dose:
   isNaN(dose)
   ?
   null
   :
   dose,

  unit:
   document
   .getElementById('unit')
   ?.value||'',

  note:
   document
   .getElementById('note')
   .value.trim(),

  partId:partId,

  targetArea:targetArea,

  targetName:targetName

 };


 if(!p.history)
  p.history=[];


 p.history.push(record);


 save();

 openField(id);

}


/* ==================================================
   HISTORIE
================================================== */

function historyHTML(p){

 const history=
 [...(p.history||[])]
 .sort(
  (a,b)=>
  String(b.date||'')
  .localeCompare(
   String(a.date||'')
  )
 );


 if(!history.length){

  return`
   <p class="muted">
    Zatím tu není žádný záznam.
   </p>
  `;

 }


 let html='';


 history.forEach(
  function(r){

   /* staré záznamy */

   if(
    r.text &&
    !r.product
   ){

    html+=`

    <div class="history">

     <b>
      ${icon(r.type)}
      ${esc(r.type)}
     </b>

     <br>

     ${esc(r.text)}

     <div class="small">
      📅 ${formatDate(r.date)}
     </div>

    </div>

    `;

    return;

   }


   const area=
   r.targetArea!==undefined
   ?
   Number(r.targetArea)
   :
   Number(p.area);


   let total='';


   if(
    r.dose!==null &&
    r.dose!==undefined
   ){

    const amount=
    Number(r.dose)*area;

    const unit=
    String(r.unit||'')
    .replace('/ha','');


    total=`

    <div class="total">

     Celkem:
     ${formatNumber(amount)}
     ${esc(unit)}

    </div>

    `;

   }


   html+=`

   <div class="history">

    <b>
     ${icon(r.type)}
     ${esc(r.type)}
    </b>

    <br>

    ${esc(r.product||'')}

    ${
     r.variety
     ?
     ' – '+esc(r.variety)
     :
     ''
    }


    ${
     r.targetName
     ?
     `<div class="small">
      📍 ${esc(r.targetName)}
      • ${formatNumber(area)} ha
      </div>`
     :
     ''
    }


    ${
     r.dose!==null &&
     r.dose!==undefined
     ?
     `<div>
      ${formatNumber(r.dose)}
      ${esc(r.unit)}
      </div>`
     :
     ''
    }


    ${total}


    <div class="small">
     📅 ${formatDate(r.date)}
    </div>


    ${
     r.note
     ?
     `<div class="small">
      📝 ${esc(r.note)}
      </div>`
     :
     ''
    }

   </div>

   `;

  }
 );


 return html;

}


/* ==================================================
   SEZNAM POLÍ
================================================== */

function openFields(){

 let arr=[];


 fields.eachLayer(
  function(layer){

   arr.push(
    layer.feature.properties
   );

  }
 );


 arr.sort(
  (a,b)=>
  a.name.localeCompare(
   b.name,
   'cs'
  )
 );


 let html=`

 <div class="notice">

  💾 Tvoje data jsou zatím
  uložená v tomto zařízení.
  Doporučuji pravidelnou zálohu.

 </div>


 <div class="actions">

  <button
   class="action green"
   onclick="exportData()">

   <span>💾</span>
   Záloha

  </button>


  <button
   class="action"
   onclick="
   document
   .getElementById('importFile')
   .click()">

   <span>📂</span>
   Obnovit

  </button>

 `;

  html+=`
   <p>
    Zatím nemáš uložené

   </p>
  `;

 }


 arr.forEach(
  function(p){

   html+=`

   <button
    class="fieldButton"
    onclick="openField('${p.id}')">

    <b>
     🌾 ${esc(p.name)}
    </b>

    <br>

    ${formatNumber(p.area)} ha

    ${
     p.parts &&
     p.parts.length
     ?
     `<div class="small">
      ✂️ ${p.parts.length}
      uložených osevních částí
      </div>`
     :
     ''
    }

   </button>

   `;

  }
 );


 showPanel(
  'Moje pole',
  html
 );

}

function renameField(id){

 findField(id);

 if(!field)return;


 const p=
 field.feature.properties;

 prompt(
  'Nový název pole:',
  p.name
 );

/* ==================================================
   NAJÍT POLE
================================================== */

function findField(id){

 let result=null;


 fields.eachLayer(
  function(layer){

   if(
    layer.feature &&
    String(
     layer.feature.properties.id
    )===
    String(id)
   ){

    result=layer;

   }

  }
 );


 return result;

}


/* ==================================================
   PANEL
================================================== */

function showPanel(
 title,
 html
){

 document
 .getElementById('panelTitle')
 .textContent=title;


 document
 .getElementById('panelContent')
 .innerHTML=html;


 document
 .getElementById('panel')
 .classList.add('open');

}


function closePanel(){

 document
 .getElementById('panel')
 .classList.remove('open');

}


/* ==================================================
   ZÁLOHA
================================================== */

function exportData(){

 const data=
 localStorage.getItem(
  'mojePoleData'
 );


 if(!data){

  alert(
   'Není co zálohovat.'
  );

  return;

 }


 const blob=
 new Blob(
  [data],
  {
   type:'application/json'
  }
 );


 const url=
 URL.createObjectURL(blob);


 const a=
 document.createElement('a');


 a.href=url;

 a.download=
 'moje-pole-zaloha-'+
 today()+
 '.json';


 document.body.appendChild(a);

 a.click();

 a.remove();


 URL.revokeObjectURL(url);

}


/* ==================================================
   IMPORT
================================================== */

document
.getElementById('importFile')
.addEventListener(
 'change',
 function(e){

  const file=
  e.target.files[0];


  if(!file)
   return;


  const reader=
  new FileReader();


  reader.onload=
  function(){

   try{

    const data=
    JSON.parse(
     reader.result
    );


    if(
     !data ||
     data.type!==
     'FeatureCollection'
    ){

     throw new Error();

    }


    if(
     !confirm(
      'Obnovit zálohu?\n\n'+
      'Současná data budou nahrazena.'
     )
    ){

     return;

    }


    localStorage.setItem(
     'mojePoleData',
     JSON.stringify(data)
    );


    alert(
     '✅ Záloha obnovena.'
    );


    location.reload();

   }

   catch(err){

    alert(
     'Soubor není platná záloha.'
    );

   }

  };


  reader.readAsText(file);

 }

);


/* ==================================================
   POMOCNÉ
================================================== */

function uid(){

 return(
  Date.now().toString()+
  Math.random()
  .toString(36)
  .slice(2,8)
 );

}


function today(){

 return new Date()
 .toISOString()
 .slice(0,10);

}


function icon(type){

 if(type==='Setí')
  return'🌱';

 if(type==='Hnojení')
  return'🚜';

 if(type==='Postřik')
  return'💧';

 if(type==='Sklizeň')
  return'🌾';

 return'📝';

}


function formatNumber(n){

 return Number(n||0)
 .toLocaleString(
  'cs-CZ',
  {
   maximumFractionDigits:2
  }
 );

}


function formatDate(d){

 if(!d)
  return'';


 const x=
 d.split('-');


 if(x.length!==3)
  return d;


 return(
  x[2]+'. '+
  x[1]+'. '+
  x[0]
 );

}


function esc(value){

 return String(value??'')

 .replaceAll(
  '&',
  '&amp;'
 )

 .replaceAll(
  '<',
  '&lt;'
 )

 .replaceAll(
  '>',
  '&gt;'
 )

 .replaceAll(
  '"',
  '&quot;'
 );

}

 fields.getLayers().length
){

   }
  );

 }
 catch(e){}

}
